name: Avatto pilot tests

on:
  push:
    branches: [codex/avatto-trv-pilot]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements_test.txt
      - run: python -m pytest -q tests/test_avatto_room_control.py tests/test_setpoint_modifier.py
